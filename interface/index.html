<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Dorian's Mosaic Controller</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="interface.css">
</head>
<body>
<section class="hero is-dark is-bold">
  <div class="hero-body">
    <div class="container">
      <button id="stop" class="is-pulled-right"></button>
      <button id="rotate" class="is-pulled-right"></button>
      <h1 class="title">Dorian's Mosaic</h1>
      <div>
        <label for="brightness">Brightness:</label>
        <input type="range" id="brightness" min="1" max="254" value="100">
      </div>
    </div>
  </div>
</section>

<div class="box is-dark">
  <label class="label">
    <span>Schedule:</span>
  </label>
  <div class="field" id="schedule">
    <table class="table is-dark">
      <thead>
        <tr>
          <th>Time</th>
          <th>Mode</th>
          <th>Brightness</th>
          <th>Options</th>
          <th>Op</th>
        </tr>
      </thead>
      <tbody></tbody>
      <tfoot>
        <tr>
          <td><input type="time" step="60"></input></td>
          <td colspan="3">Current State</td>
          <td><button class="button is-success">+</button></td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>

<div class="box">
  <label class="label">
    <span>Animations:</span>
  </label>
  <div class="field" id="images">
    Images...
  </div>
</div>


<div class="box">
  <label class="label">
    <span>Bouncy Ball:</span>
  </label>
  <div class="field" id="balls">
    <div class="picker"></div>
  </div>
</div>

<div class="box">
  <label class="label">
    <span>Clock:</span>
  </label>
  <div class="field" id="clock">
    <div class="picker"></div>
  </div>
</div>


<div class="box">
  <label class="label">
    <span>Scrolling Text:</span>
  </label>
  <div class="field" id="text">
    <label for="speed">Speed:</label>
    <input type="range" id="speed" min="1" max="5" value="2">
    <input type="text" id="text-input" value="Sample text">
    <div class="picker"></div>
  </div>
</div>

<div class="box">
  <label class="label">
    <span>Solid Color:</span>
  </label>
  <div class="field" id="solid">
    <div class="picker"></div>
  </div>
</div>

<div class="box">
  <label class="label">
    <span>Power:</span>
  </label>
  <div class="field" id="power">
  </div>
</div>

<script type="text/javascript">
  function post(name, opts = true) {
    const data = {};
    data[name] = opts;
    return fetch('data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
  }

  // Bind buttons.
  document.getElementById('stop').addEventListener('click', () => {
    post('stop');
  });

  document.getElementById('rotate').addEventListener('click', () => {
    post('rotate', 5);
  });

  // Simple color inputs instead of color picker
  document.querySelector('#solid .picker').innerHTML = '<input type="color" id="solid-color" value="#ff0000">';
  document.querySelector('#clock .picker').innerHTML = '<input type="color" id="clock-color" value="#ff0000">';
  document.querySelector('#balls .picker').innerHTML = '<input type="color" id="ball-color" value="#ff0000">';
  document.querySelector('#text .picker').innerHTML = '<input type="color" id="text-color" value="#0000ff">';

  document.getElementById('solid-color').addEventListener('change', (e) => {
    post('color', e.target.value);
  });

  document.getElementById('clock-color').addEventListener('change', (e) => {
    post('clock', { color: e.target.value });
  });

  document.getElementById('ball-color').addEventListener('change', (e) => {
    post('ball', e.target.value);
  });

  document.getElementById('text-color').addEventListener('change', (e) => {
    post('scroll', {
      text: document.getElementById('text-input').value,
      size: 8,
      speed: document.getElementById('speed').value,
      font: 'Minecraftia',
      baseline: 6,
      color: e.target.value,
    });
  });

  // Bind Brightness Slider.
  document.getElementById('brightness').addEventListener('change', (e) => {
    fetch('bright', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({brightness: e.target.value})
    });
  });

  // Add power options
  ['shutdown', 'restart'].forEach((option) => {
    const btn = document.createElement('button');
    btn.textContent = option;
    btn.addEventListener('click', () => {
      post('power', option);
    });
    document.getElementById('power').appendChild(btn);
  });

  function toAMPM(time) {
    const t = time.split(':');
    let h = parseInt(t[0], 10);
    let m = t[1];
    let mer = 'A';

    if (h > 12) {
      h = h - 12;
      mer = 'P'
    }

    return `${h}:${m} ${mer}M`;
  }

  // Get schedule options.
  function buildSchedule({ data: schedule }) {
    const tbody = document.querySelector('#schedule tbody');
    tbody.innerHTML = '';
    Object.entries(schedule).forEach(([time, entry]) => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${toAMPM(time)}</td>
        <td>${entry.mode}</td>
        <td>${entry.brightness}</td>
        <td>${JSON.stringify(entry.options)}</td>
        <td>
          <button class="button is-secondary is-small" onclick="fetch('schedule/${time}', {method: 'PUT'})">👁️</button>
          <button class="button is-primary is-small" onclick="fetch('schedule', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({time: '${time}'})}).then(() => fetch('schedule').then(r => r.json()).then(buildSchedule))">🔄</button>
          <button class="button is-danger is-small" onclick="fetch('schedule/${time}', {method: 'DELETE'}).then(() => fetch('schedule').then(r => r.json()).then(buildSchedule))">🗑️</button>
        </td>
      `;
      tbody.appendChild(row);
    });
  }

  // Get initial schedule, bind buttons.
  fetch('schedule').then(r => r.json()).then(buildSchedule);
  document.querySelector('#schedule tfoot button').addEventListener('click', () => {
    fetch('schedule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ time: document.querySelector('#schedule tfoot input').value })
    }).then(r => r.json()).then(buildSchedule);
  });

  

  // Get the images.
  fetch('data').then(r => r.json()).then((data) => {
    const images = document.getElementById('images');
    images.innerHTML = '';
    Object.entries(data.images).forEach(([name, { fps }]) => {
      const btn = document.createElement('button');
      btn.style.backgroundImage = `url("/images/animations/${name}_${fps}.png")`;
      btn.textContent = name;
      btn.addEventListener('click', () => post('image', name));
      images.appendChild(btn);
    });

    // Add plasma modes
    const plasmaBtn = document.createElement('button');
    plasmaBtn.textContent = 'Plasma!';
    plasmaBtn.addEventListener('click', () => post('plasma', {}));
    images.appendChild(plasmaBtn);

    const pclockBtn = document.createElement('button');
    pclockBtn.style.backgroundImage = 'url("/images/plasma.png")';
    pclockBtn.textContent = 'PClock';
    pclockBtn.addEventListener('click', () => post('plasma', {withClock: true}));
    images.appendChild(pclockBtn);

    const flipPclockBtn = document.createElement('button');
    flipPclockBtn.style.backgroundImage = 'url("/images/plasma.png")';
    flipPclockBtn.textContent = '!PClock';
    flipPclockBtn.addEventListener('click', () => post('plasma', {withClock: true, flipClock: true}));
    images.appendChild(flipPclockBtn);
  });
</script>
</body>
</html>
